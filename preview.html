<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>reviewcard.hr — mobilni pregled</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1018; --panel:#161826; --line:#272a3d;
    --text:#e9e9ed; --muted:#8b8fa3; --accent:#9184d9;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:26px 20px 48px;
    background-image:radial-gradient(760px 420px at 50% -10%, #2a2450 0%, transparent 62%);
  }

  header{text-align:center; margin-bottom:20px}
  h1{font-size:19px; font-weight:500; margin:0 0 6px; letter-spacing:-.01em}
  h1 b{color:var(--accent); font-weight:500}
  .sub{font-size:13px; color:var(--muted); margin:0}

  /* --- prekidaci uredaja --- */
  .bar{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin:18px 0 22px; padding:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
  }
  .bar button{
    appearance:none; cursor:pointer; font:inherit; font-size:13px;
    padding:9px 15px; border-radius:999px; border:1px solid transparent;
    background:transparent; color:var(--muted); transition:.16s;
    white-space:nowrap;
  }
  .bar button:hover{color:var(--text)}
  .bar button[aria-pressed="true"]{
    background:color-mix(in srgb, var(--accent) 18%, transparent);
    border-color:var(--accent); color:#fff;
  }
  .bar button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* --- okvir telefona --- */
  .device{
    position:relative; flex:0 0 auto;
    padding:13px; border-radius:44px;
    background:linear-gradient(160deg,#3a3d52,#16182a 42%,#2c2f42);
    box-shadow:0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06);
    transition:width .28s ease, height .28s ease;
  }
  .device::after{  /* rub ekrana */
    content:""; position:absolute; inset:11px; border-radius:34px;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.85); pointer-events:none; z-index:3;
  }
  .screen{
    position:relative; width:100%; height:100%;
    border-radius:33px; overflow:hidden; background:#161826;
  }
  .notch{
    position:absolute; top:9px; left:50%; transform:translateX(-50%);
    width:36%; max-width:150px; height:26px; border-radius:999px;
    background:#000; z-index:2; pointer-events:none;
  }
  .device[data-land="1"] .notch{display:none}

  iframe{width:100%; height:100%; border:0; display:block; background:#161826}

  .meta{
    margin-top:16px; font-size:12px; color:var(--muted);
    display:flex; gap:14px; justify-content:center; flex-wrap:wrap;
  }
  .meta code{
    background:var(--panel); border:1px solid var(--line);
    padding:2px 7px; border-radius:5px; color:var(--text); font-size:11px;
  }

  .actions{display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; justify-content:center}
  .actions a{
    font-size:13px; text-decoration:none; padding:10px 17px; border-radius:8px;
    border:1px solid var(--line); color:var(--muted); transition:.16s;
  }
  .actions a:hover{border-color:var(--accent); color:var(--text)}

  .warn{
    margin-top:26px; max-width:560px; font-size:12.5px; line-height:1.6;
    color:var(--muted); text-align:center;
    border:1px dashed #7a5a1e; background:rgba(245,158,11,.06);
    border-radius:10px; padding:14px 18px;
  }
  .warn b{color:#fcd34d; font-weight:500}

  /* na uskim ekranima okvir nema smisla — pusti stranicu u punoj sirini */
  @media (max-width:820px){
    body{padding:16px 12px 30px}
    .device{padding:0; border-radius:16px; box-shadow:none; width:100%!important; height:76vh!important}
    .device::after,.notch{display:none}
    .screen{border-radius:14px}
    .bar{margin-bottom:14px}
  }
</style>
</head>
<body>

<header>
  <h1>reviewcard<b>.hr</b> — mobilni pregled</h1>
  <p class="sub">Stvarna stranica u okviru telefona. Skrolaj unutar ekrana.</p>
</header>

<div class="bar" id="bar" role="group" aria-label="Odaberi uređaj"></div>

<div class="device" id="device">
  <div class="notch"></div>
  <div class="screen">
    <iframe id="frame" src="index.html?v=13" title="reviewcard.hr mobilni prikaz"></iframe>
  </div>
</div>

<p class="meta">
  <span>Veličina: <code id="dims">390 × 844</code></span>
  <span>Uređaj: <code id="devname">iPhone 14</code></span>
</p>

<div class="actions">
  <a href="#" id="reload">↻ Osvježi</a>
  <a href="index.html" target="_blank" rel="noopener">Otvori u punoj širini ↗</a>
</div>

<p class="warn">
  <b>Ovo je pregledna verzija.</b> WhatsApp broj je još placeholder
  <code>385000000000</code> pa gumbi ne vode nikamo.
</p>

<script>
(function () {
  var DEVICES = [
    { id:'se',   name:'iPhone SE',    w:375,  h:667 },
    { id:'i14',  name:'iPhone 14',    w:390,  h:844 },
    { id:'pmax', name:'iPhone Pro Max', w:430, h:932 },
    { id:'gal',  name:'Galaxy S',     w:360,  h:800 },
    { id:'land', name:'Vodoravno',    w:844,  h:390, land:true }
  ];

  var bar    = document.getElementById('bar');
  var device = document.getElementById('device');
  var frame  = document.getElementById('frame');
  var dims   = document.getElementById('dims');
  var devnm  = document.getElementById('devname');
  var current = 'i14';

  function apply(d) {
    current = d.id;
    device.style.width  = (d.w + 26) + 'px';   // 13px okvira sa svake strane
    device.style.height = (d.h + 26) + 'px';
    device.dataset.land = d.land ? '1' : '0';
    dims.textContent  = d.w + ' × ' + d.h;
    devnm.textContent = d.name;
    [].forEach.call(bar.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.id === d.id ? 'true' : 'false');
    });
  }

  DEVICES.forEach(function (d) {
    var b = document.createElement('button');
    b.textContent = d.name;
    b.dataset.id = d.id;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { apply(d); });
    bar.appendChild(b);
  });

  apply(DEVICES[1]);

  document.getElementById('reload').addEventListener('click', function (e) {
    e.preventDefault();
    frame.src = frame.src.split('#')[0];
  });
})();
</script>
</body>
</html>
